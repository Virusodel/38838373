name: Build Ransomware Builder v4.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install pyinstaller pycryptodome pillow
        
    - name: Build Builder with PyInstaller embedded
      run: |
        pyinstaller --onefile --noconsole --name "RansomwareBuilder_v4" builder.py
        
    - name: Upload Builder EXE
      uses: actions/upload-artifact@v4
      with:
        name: RansomwareBuilder_v4
        path: dist/RansomwareBuilder_v4.exe
