name: Build raznos XP (LLVM)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install LLVM MinGW
      run: |
        curl -L -o llvm-mingw.zip https://github.com/mstorsjo/llvm-mingw/releases/download/20241030/llvm-mingw-20241030-msvcrt-x86_64.zip
        unzip llvm-mingw.zip -d C:\llvm-mingw
        echo "C:\llvm-mingw\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Build for Windows XP
      run: |
        C:\llvm-mingw\bin\clang++ -O2 -static -mwindows -D_WIN32_WINNT=0x0501 -DWINVER=0x0501 -o raznos_xp.exe raznos_xp.cpp -lgdi32 -lwinmm -lmsimg32

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: raznos-xp
        path: raznos_xp.exe
        retention-days: 90

    - name: Create Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: raznos XP v1.0.${{ github.run_number }}
        files: raznos_xp.exe
        draft: false
        prerelease: false
